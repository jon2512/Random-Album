services:
  spin-api:
    build: .
    container_name: spin-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # Synology: map to a shared folder, e.g. /volume1/docker/spin-data
      - ./data:/data
    environment:
      PORT: "8787"
      SPIN_DATA_DIR: /data
      SPIN_MAX_PROFILES: "8"
